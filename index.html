<div class="login-page">
  <div class="login-card">
    <div class="brand-block">
      <img src="images/muctat-logo.jpg" alt="Logo">
      <h1>Courriers</h1>
    </div>

    <form id="form-login">
      <div class="field">
        <label>Identifiant</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <p id="erreur-login" class="msg-error" style="display:none;"></p>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="btn-connexion">
        Se connecter
      </button>
    </form>
  </div>
</div>

<script src="js/api-client.js"></script>
<script>
  CourrierAPI.moi().then(() => { window.location.href = 'accueil.html'; }).catch(() => {});

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const bouton = document.getElementById('btn-connexion');
    const erreur = document.getElementById('erreur-login');
    erreur.style.display = 'none';
    bouton.disabled = true;
    bouton.textContent = 'Connexion…';

    try {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      await CourrierAPI.login(username, password);
      window.location.href = 'accueil.html';
    } catch (err) {
      erreur.textContent = err.message;
      erreur.style.display = 'block';
      bouton.disabled = false;
      bouton.textContent = 'Se connecter';
    }
  });
</script>
